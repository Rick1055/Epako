name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU torch (CI has no GPU), then the other pins
        run: |
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          grep -v '^torch==' requirements.txt > ci-requirements.txt
          pip install -r ci-requirements.txt pytest pgserver psycopg2-binary pyflakes
      - run: python -m pytest tests -q

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Epako Voice tree</title>
<!-- The moss root of epako_sylva_experience.html, alone: framed behind Welcome, Sign in and Sign up on capable devices
     (app/components/Sylva.tsx). Three.js r149 is the version the mock was written for. -->
<style>
  :root{ --u: calc(100vw / 1600); --rule: rgba(255,255,255,.055); --ease: cubic-bezier(.22,.61,.36,1); }
  @media (min-width:1900px){ :root{ --u: calc(1900px / 1600); } }
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  html, body{ background:#4a4d44; overflow:hidden; }
  .hero{
    position:relative; width:100%; height:100svh; min-height:calc(880 * var(--u)); overflow:hidden; isolation:isolate;
    background:
      radial-gradient(64% 52% at 27% 84%, rgba(232,238,222,.085) 0%, rgba(232,238,222,0) 72%),
      radial-gradient(70% 60% at 92% 8%, rgba(24,28,20,.10) 0%, rgba(24,28,20,0) 68%),
      #4a4d44;
  }
  .hero::after{
    content:''; position:absolute; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(72% 44% at 50% 117%, rgba(238,243,231,.50) 0%, rgba(238,243,231,.21) 42%, rgba(238,243,231,.04) 72%, rgba(238,243,231,0) 88%),
      linear-gradient(180deg, rgba(238,243,231,0) 54%, rgba(238,243,231,.03) 78%, rgba(238,243,231,.085) 100%);
  }
  .stage{
    position:absolute; left:50%; top:50%;
    margin-left:calc(-800 * var(--u)); margin-top:calc(-440 * var(--u));
    width:calc(1600 * var(--u)); height:calc(880 * var(--u));
  }
  #scene{ position:absolute; inset:0; z-index:3; width:100%; height:100%; pointer-events:none; opacity:0; transition:opacity .7s var(--ease); }
  .is-ready #scene{ opacity:1; }
  @media (prefers-reduced-motion:reduce){ #scene{ opacity:1 !important; transition:none !important; } }
  @media (max-width:900px){
    :root{ --u: calc(100vw / 760); }
    .hero{ height:100svh; }
    .stage{ position:relative; left:auto; top:auto; margin:0; width:100%; height:calc(1625 * var(--u)); }
  }
</style>
</head>
<body>
<main class="hero" id="hero" aria-hidden="true">
  <canvas id="scene"></canvas>
  <div class="stage" id="stage"></div>
</main>
<script src="three-r149.min.js"></script>
<script src="scene.js"></script>
</body>
</html>
